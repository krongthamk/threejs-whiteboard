name: Check
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/license-audit.mjs
      - run: pnpm --filter @whiteboard/app build
        env:
          VITE_TEST_HOOKS: '0'
      - run: node scripts/check-production-hooks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: test-results/
  browser:
    env:
      VERIFY_PDF: '1'
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf==1.26.4
      - id: install-browser
        run: pnpm exec playwright install chrome
      - run: pnpm test:browser
        if: ${{ !cancelled() && steps.install-browser.outcome == 'success' }}
      - run: pnpm test:app
        if: ${{ !cancelled() && steps.install-browser.outcome == 'success' }}
      - run: pnpm test:routed
        if: ${{ !cancelled() && steps.install-browser.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
  benchmarks:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERIFY_PDF: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf==1.26.4
      - id: install-browser
        run: pnpm exec playwright install chrome
      - run: RUN_APP_BENCHMARK=1 pnpm test:app
        if: ${{ !cancelled() && steps.install-browser.outcome == 'success' }}
      - run: node spikes/renderer/run-benchmark.mjs
        if: ${{ !cancelled() && steps.install-browser.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            playwright-report/
            test-results/
            spikes/renderer/artifacts/
