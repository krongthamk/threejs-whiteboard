name: Check
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/license-audit.mjs
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:browser
      - run: pnpm test:app
      - run: pnpm test:routed
      - run: pnpm --filter @whiteboard/app build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
